<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #7ec850, #5aad2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        /* Selector Bar */
        .selector-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 10px 20px;
            border: 2px solid #7ec850;
            background: rgba(126, 200, 80, 0.1);
            color: #7ec850;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .category-btn:hover {
            background: rgba(126, 200, 80, 0.2);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: #7ec850;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(126, 200, 80, 0.5);
        }

        /* Roulette Container */
        .roulette-container {
            position: relative;
            margin-bottom: 50px;
        }

        .pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #7ec850;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .roulette-box {
            position: relative;
            height: 140px;
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid #7ec850;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(126, 200, 80, 0.3), inset 0 0 20px rgba(126, 200, 80, 0.1);
            display: flex;
            align-items: center;
        }

        .roulette-items {
            display: flex;
            height: 100%;
            gap: 10px;
            padding: 0 20px;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .item-slot {
            flex: 0 0 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .item-slot.center {
            opacity: 1;
            transform: scale(1.2);
        }

        .item-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        .item-slot.center .item-icon {
            border: 3px solid #7ec850;
            box-shadow: 0 0 20px rgba(126, 200, 80, 0.8), inset 0 0 10px rgba(126, 200, 80, 0.3);
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(126, 200, 80, 0.8), inset 0 0 10px rgba(126, 200, 80, 0.3); }
            50% { box-shadow: 0 0 30px rgba(126, 200, 80, 1), inset 0 0 15px rgba(126, 200, 80, 0.5); }
        }

        .item-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .item-name {
            font-size: 0.75em;
            text-align: center;
            color: #b0b0b0;
            max-width: 95px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-slot.center .item-name {
            color: #7ec850;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(126, 200, 80, 0.5);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-spin {
            background: linear-gradient(135deg, #7ec850, #5aad2a);
            color: white;
            min-width: 150px;
            box-shadow: 0 5px 20px rgba(126, 200, 80, 0.3);
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(126, 200, 80, 0.5);
        }

        .btn-spin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(126, 200, 80, 0.15);
            color: #7ec850;
            border: 2px solid #7ec850;
        }

        .btn-secondary:hover {
            background: rgba(126, 200, 80, 0.25);
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #7ec850;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(126, 200, 80, 0.2);
        }

        .stat-value {
            font-size: 2.5em;
            color: #7ec850;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        /* History */
        .history-section {
            margin-top: 40px;
        }

        .history-title {
            font-size: 1.3em;
            color: #7ec850;
            margin-bottom: 15px;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(126, 200, 80, 0.1);
            border: 1px solid rgba(126, 200, 80, 0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
        }

        .history-item:hover {
            background: rgba(126, 200, 80, 0.2);
            color: #7ec850;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .item-slot { flex: 0 0 80px; }
            .item-icon { width: 60px; height: 60px; }
            .controls { flex-direction: column; }
            .btn { width: 100%; }
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }
        .history-list::-webkit-scrollbar-track {
            background: rgba(126, 200, 80, 0.1);
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #7ec850;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛏️ Minecraft Roulette</h1>
            <p class="subtitle">Escolha uma categoria e gire!</p>
        </header>

        <div class="selector-bar">
            <button class="category-btn active" data-category="items">Items</button>
            <button class="category-btn" data-category="blocks">Blocos</button>
            <button class="category-btn" data-category="all">Misturado</button>
        </div>

        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="roulette-box">
                <div class="roulette-items" id="rouletteItems"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-spin" id="spinBtn">🎲 GIRAR</button>
            <button class="btn btn-secondary" id="resetBtn">↻ Resetar</button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Giros Totais</div>
                <div class="stat-value" id="totalSpins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Itens Únicos</div>
                <div class="stat-value" id="uniqueItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Favorito</div>
                <div class="stat-value" id="favoriteItem">-</div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">Histórico (últimos 20)</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const ITEMS_DATA = {
            items: [
                'apple', 'wheat', 'diamond', 'emerald', 'gold_ingot', 'iron_ingot', 'coal',
                'stick', 'book', 'bone', 'string', 'ender_pearl', 'gunpowder', 'leather',
                'arrow', 'clay_ball', 'feather', 'redstone', 'amethyst_shard', 'raw_gold'
            ],
            blocks: [
                'stone', 'grass', 'dirt', 'sand', 'acacia_log', 'acacia_leaves', 'cobblestone',
                'bedrock', 'oak_planks', 'oak_leaves', 'chest', 'furnace', 'iron_ore',
                'gold_ore', 'diamond_ore', 'emerald_ore', 'glass', 'bookshelf', 'lava', 'water'
            ]
        };

        let currentItems = [...ITEMS_DATA.items];
        let currentIndex = 0;
        let stats = {
            totalSpins: 0,
            uniqueItems: new Set(),
            itemCounts: {},
            history: []
        };
        let isSpinning = false;

        const rouletteItemsEl = document.getElementById('rouletteItems');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const categoryBtns = document.querySelectorAll('.category-btn');

        // Mudar categoria
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const category = e.target.dataset.category;
                if (category === 'all') {
                    currentItems = [...ITEMS_DATA.items, ...ITEMS_DATA.blocks];
                } else {
                    currentItems = [...ITEMS_DATA[category]];
                }
                currentIndex = 0;
                renderRoulette();
            });
        });

        function getImagePath(itemName) {
            // Tentar item primeiro, depois bloco
            return `../minecraft/textures/item/${itemName}.png`;
        }

        function renderRoulette() {
            rouletteItemsEl.innerHTML = '';
            
            // Mostrar 5 items: 2 antes, 1 no centro, 2 depois (com wraparound)
            for (let i = -2; i <= 2; i++) {
                const index = (currentIndex + i + currentItems.length) % currentItems.length;
                const itemName = currentItems[index];
                
                const slot = document.createElement('div');
                slot.className = 'item-slot' + (i === 0 ? ' center' : '');
                slot.innerHTML = `
                    <div class="item-icon">
                        <img src="${getImagePath(itemName)}" alt="${itemName}" onerror="this.style.display='none'">
                    </div>
                    <div class="item-name">${itemName.replace(/_/g, ' ')}</div>
                `;
                rouletteItemsEl.appendChild(slot);
            }
        }

        function spinRoulette() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            // Escolher um item aleatório
            const randomIndex = Math.floor(Math.random() * currentItems.length);
            const totalRotations = 15 + Math.floor(Math.random() * 10);
            const totalSteps = totalRotations * currentItems.length;
            
            let step = 0;
            
            const spinInterval = setInterval(() => {
                step++;
                currentIndex = (currentIndex + 1) % currentItems.length;
                renderRoulette();
                
                if (step >= totalSteps) {
                    clearInterval(spinInterval);
                    
                    // Ajustar para exatamente no índice correto
                    currentIndex = randomIndex;
                    renderRoulette();
                    
                    recordSpin(currentItems[randomIndex]);
                    
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, 30);
        }

        function recordSpin(itemName) {
            stats.totalSpins++;
            stats.uniqueItems.add(itemName);
            stats.itemCounts[itemName] = (stats.itemCounts[itemName] || 0) + 1;
            stats.history.unshift(itemName.replace(/_/g, ' '));
            if (stats.history.length > 20) stats.history.pop();
            
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalSpins').textContent = stats.totalSpins;
            document.getElementById('uniqueItems').textContent = stats.uniqueItems.size;
            
            if (stats.uniqueItems.size > 0) {
                const favorite = [...stats.uniqueItems].reduce((a, b) => 
                    (stats.itemCounts[a] || 0) > (stats.itemCounts[b] || 0) ? a : b
                );
                document.getElementById('favoriteItem').textContent = favorite.replace(/_/g, ' ');
            }
            
            document.getElementById('historyList').innerHTML = stats.history
                .map(name => `<div class="history-item">${name}</div>`)
                .join('');
        }

        spinBtn.addEventListener('click', spinRoulette);
        resetBtn.addEventListener('click', () => {
            stats = {
                totalSpins: 0,
                uniqueItems: new Set(),
                itemCounts: {},
                history: []
            };
            updateStats();
        });

        // Inicializar
        renderRoulette();
        updateStats();
    </script>
</body>
</html>
