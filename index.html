<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Minecraft Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .winner-display {
            text-align: center;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            border: 3px solid #22c55e;
            border-radius: 8px;
            padding: 20px;
        }

        .winner-display img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin-bottom: 15px;
        }

        .winner-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #22c55e;
            text-transform: capitalize;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .carousel {
            display: flex;
            height: 100%;
            transform: translateX(0);
            will-change: transform;
        }

        .carousel-item {
            flex-shrink: 0;
            width: 120px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-right: 1px solid #333;
        }

        .carousel-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .carousel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid #22c55e;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-spin {
            background: #22c55e;
            color: #000;
            flex: 1;
            max-width: 350px;
        }

        .btn-spin:hover:not(:disabled) {
            background: #16a34a;
            transform: scale(1.05);
        }

        .btn-spin:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-reset {
            background: #f97316;
            color: #000;
        }

        .btn-reset:hover {
            background: #ea580c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #2a2a2a;
            border: 2px solid #22c55e;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #22c55e;
        }

        .category-selector {
            background: #2a2a2a;
            border: 2px solid #22c55e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .category-selector h3 {
            margin-bottom: 15px;
            color: #22c55e;
            font-size: 1.1em;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
            transition: all 0.2s;
            background: #1a1a1a;
            border: 2px solid #333;
        }

        .category-item:hover {
            border-color: #22c55e;
        }

        .category-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .category-item label {
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }

        .category-count {
            color: #aaa;
            font-size: 0.9em;
        }

        .history {
            background: #2a2a2a;
            border: 2px solid #22c55e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 30px;
        }

        .history h3 {
            margin-bottom: 15px;
            color: #22c55e;
        }

        .history-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .history-item {
            text-align: center;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .history-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin-bottom: 4px;
        }

        .history-item span {
            font-size: 0.8em;
            color: #aaa;
            display: block;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛏️ Minecraft Roulette</h1>

        <!-- VENCEDOR -->
        <div class="winner-display">
            <div id="winnerContent" style="display: none;">
                <img id="winnerImage" src="" alt="winner">
                <div class="winner-name" id="winnerName">-</div>
            </div>
            <div id="noWinner" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div style="font-size: 4em;">🎰</div>
                <div style="color: #aaa;">Clique em GIRAR para começar!</div>
            </div>
        </div>

        <!-- CAROUSEL -->
        <div class="carousel-container">
            <div class="carousel-pointer"></div>
            <div class="carousel scrollbar-hide" id="carousel"></div>
        </div>

        <!-- CONTROLES -->
        <div class="controls">
            <button class="btn-spin" id="spinBtn">🎲 GIRAR 🎲</button>
            <button class="btn-reset">↻ RESETAR</button>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total de Giros</div>
                <div class="stat-value" id="totalSpins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Itens Únicos</div>
                <div class="stat-value" id="uniqueItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Favorito</div>
                <div class="stat-value" id="favorite">-</div>
            </div>
        </div>

        <!-- SELEÇÃO DE CATEGORIAS -->
        <div class="category-selector">
            <h3>📦 Selecione o que quer girar:</h3>
            <div class="category-list">
                <div class="category-item">
                    <input type="checkbox" id="cat-items" checked>
                    <label for="cat-items">Items</label>
                    <span class="category-count">(831)</span>
                </div>
                <div class="category-item">
                    <input type="checkbox" id="cat-blocks" checked>
                    <label for="cat-blocks">Blocos</label>
                    <span class="category-count">(1228)</span>
                </div>
                <div class="category-item">
                    <input type="checkbox" id="cat-mobs" checked>
                    <label for="cat-mobs">Mobs</label>
                    <span class="category-count">(543)</span>
                </div>
            </div>
        </div>

        <!-- HISTÓRICO -->
        <div class="history">
            <h3>📜 Últimos 20 Giros</h3>
            <div class="history-items scrollbar-hide" id="history"></div>
        </div>
    </div>

    <script src="/minecraft-roulette/textures.js"></script>

    <script>
        const ITEM_WIDTH = 120;
        const SPIN_DURATION = 3500;

        let isSpinning = false;
        let allItems = [];
        let spinHistory = [];
        let stats = {
            total: 0,
            unique: new Set(),
            counts: {}
        };

        function init() {
            buildItemsList();
            setupEventListeners();
            renderCarousel();
        }

        function buildItemsList() {
            const useItems = document.getElementById('cat-items').checked;
            const useBlocks = document.getElementById('cat-blocks').checked;
            const useMobs = document.getElementById('cat-mobs').checked;

            allItems = [];
            if (useItems) allItems = allItems.concat(itemsData);
            if (useBlocks) allItems = allItems.concat(blocksData);
            if (useMobs) allItems = allItems.concat(mobsData);

            if (allItems.length === 0) {
                allItems = itemsData;
                document.getElementById('cat-items').checked = true;
            }

            renderCarousel();
        }

        function setupEventListeners() {
            ['cat-items', 'cat-blocks', 'cat-mobs'].forEach(id => {
                document.getElementById(id).addEventListener('change', buildItemsList);
            });

            document.getElementById('spinBtn').addEventListener('click', spin);

            document.querySelector('.btn-reset').addEventListener('click', () => {
                spinHistory = [];
                stats = { total: 0, unique: new Set(), counts: {} };
                updateStats();
                document.getElementById('history').innerHTML = '';
                document.getElementById('noWinner').style.display = 'flex';
                document.getElementById('winnerContent').style.display = 'none';
                renderCarousel();
            });
        }

        function renderCarousel() {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = '';
            carousel.style.transform = 'translateX(0)';
            carousel.style.transition = 'none';

            // Renderizar 150 vezes para garantir animação suave
            for (let i = 0; i < 150; i++) {
                allItems.forEach(id => {
                    const texture = textureMap[id];
                    if (!texture) return;

                    const div = document.createElement('div');
                    div.className = 'carousel-item';
                    div.innerHTML = `<img src="${texture}" alt="${id}" onerror="this.style.display='none'">`;
                    carousel.appendChild(div);
                });
            }
        }

        function spin() {
            if (isSpinning || allItems.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const itemCount = allItems.length;
            const targetIndex = Math.floor(Math.random() * itemCount);
            const spinCount = 20 + Math.floor(Math.random() * 25);

            // Calcular distância
            const totalDistance = (spinCount * itemCount + targetIndex) * ITEM_WIDTH;

            const carousel = document.getElementById('carousel');
            carousel.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.15, 0.82, 0.35, 0.99)`;
            carousel.style.transform = `translateX(-${totalDistance}px)`;

            setTimeout(() => {
                const winner = allItems[targetIndex];
                addToHistory(winner);
                showWinner(winner);
                updateStats();

                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, SPIN_DURATION);
        }

        function showWinner(itemId) {
            const texture = textureMap[itemId];
            if (!texture) return;

            document.getElementById('winnerImage').src = texture;
            document.getElementById('winnerName').textContent = itemId.replace(/_/g, ' ').toUpperCase();
            document.getElementById('noWinner').style.display = 'none';
            document.getElementById('winnerContent').style.display = 'flex';
        }

        function addToHistory(itemId) {
            spinHistory.unshift(itemId);
            if (spinHistory.length > 20) spinHistory.pop();

            const history = document.getElementById('history');
            history.innerHTML = '';
            spinHistory.forEach((id, i) => {
                const texture = textureMap[id];
                if (!texture) return;

                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <img src="${texture}" alt="${id}" onerror="this.style.display='none'">
                    <span>#${i + 1}</span>
                `;
                history.appendChild(div);
            });

            stats.total++;
            stats.unique.add(itemId);
            stats.counts[itemId] = (stats.counts[itemId] || 0) + 1;
        }

        function updateStats() {
            document.getElementById('totalSpins').textContent = stats.total;
            document.getElementById('uniqueItems').textContent = stats.unique.size;

            if (stats.total > 0) {
                const favorite = Object.keys(stats.counts).sort((a, b) => stats.counts[b] - stats.counts[a])[0];
                document.getElementById('favorite').textContent = favorite.replace(/_/g, ' ');
            }
        }

        init();
    </script>
</body>
</html>
