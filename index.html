<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            font-family: 'Minecraft', 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #7ec850, #5aad2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        /* Selector Bar */
        .selector-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 10px 20px;
            border: 2px solid #7ec850;
            background: rgba(126, 200, 80, 0.1);
            color: #7ec850;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .category-btn:hover {
            background: rgba(126, 200, 80, 0.2);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: #7ec850;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(126, 200, 80, 0.5);
        }

        /* Roulette Section */
        .roulette-section {
            position: relative;
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease-out 0.2s backwards;
        }

        .selector-pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #7ec850;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .carousel-container {
            position: relative;
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border: 3px solid #7ec850;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 
                0 0 30px rgba(126, 200, 80, 0.3),
                inset 0 0 20px rgba(126, 200, 80, 0.1);
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .carousel-item {
            flex: 0 0 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.6;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .carousel-item.center {
            opacity: 1;
            transform: scale(1.15);
        }

        .item-icon {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s ease;
            position: relative;
        }

        .carousel-item.center .item-icon {
            box-shadow: 
                0 0 20px rgba(126, 200, 80, 0.6),
                0 0 40px rgba(126, 200, 80, 0.3),
                inset 0 0 10px rgba(126, 200, 80, 0.2);
            border: 3px solid #7ec850;
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(126, 200, 80, 0.6), 0 0 40px rgba(126, 200, 80, 0.3), inset 0 0 10px rgba(126, 200, 80, 0.2); }
            50% { box-shadow: 0 0 30px rgba(126, 200, 80, 0.8), 0 0 60px rgba(126, 200, 80, 0.4), inset 0 0 15px rgba(126, 200, 80, 0.3); }
        }

        .item-icon svg {
            width: 70%;
            height: 70%;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .item-name {
            font-size: 0.9em;
            text-align: center;
            color: #b0b0b0;
            max-width: 140px;
            text-transform: capitalize;
            transition: color 0.2s ease;
        }

        .carousel-item.center .item-name {
            color: #7ec850;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(126, 200, 80, 0.5);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-spin {
            background: linear-gradient(135deg, #7ec850, #5aad2a);
            color: white;
            min-width: 150px;
            box-shadow: 0 5px 20px rgba(126, 200, 80, 0.3);
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(126, 200, 80, 0.5);
        }

        .btn-spin:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-spin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(126, 200, 80, 0.15);
            color: #7ec850;
            border: 2px solid #7ec850;
        }

        .btn-secondary:hover {
            background: rgba(126, 200, 80, 0.25);
            transform: translateY(-2px);
        }

        /* Stats Section */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #7ec850;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(126, 200, 80, 0.2);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-value {
            font-size: 2.5em;
            color: #7ec850;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        /* History Section */
        .history-section {
            margin-top: 40px;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        .history-title {
            font-size: 1.3em;
            color: #7ec850;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(126, 200, 80, 0.1);
            border: 1px solid rgba(126, 200, 80, 0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.9em;
            color: #b0b0b0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .history-item:hover {
            background: rgba(126, 200, 80, 0.2);
            border-color: rgba(126, 200, 80, 0.6);
            color: #7ec850;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .carousel-item {
                flex: 0 0 120px;
            }

            .item-icon {
                width: 60px;
                height: 60px;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Scrollbar */
        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(126, 200, 80, 0.1);
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #7ec850;
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb:hover {
            background: #5aad2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛏️ Minecraft Roulette</h1>
            <p class="subtitle">Escolha uma categoria e gire!</p>
        </header>

        <div class="selector-bar">
            <button class="category-btn active" data-category="items">Items</button>
            <button class="category-btn" data-category="blocks">Blocos</button>
            <button class="category-btn" data-category="mobs">Mobs</button>
            <button class="category-btn" data-category="all">Todos</button>
        </div>

        <div class="roulette-section">
            <div class="selector-pointer"></div>
            <div class="carousel-container">
                <div class="carousel-track" id="carouselTrack"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-spin" id="spinBtn">🎲 GIRAR</button>
            <button class="btn btn-secondary" id="resetBtn">↻ Resetar</button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Giros Totais</div>
                <div class="stat-value" id="totalSpins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Itens Únicos</div>
                <div class="stat-value" id="uniqueItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Favorito</div>
                <div class="stat-value" id="favoriteItem">-</div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">Histórico (últimos 20)</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        // Items data com ícones emoji
        const itemsData = {
            items: [
                { id: 'apple', name: 'Maçã', icon: '🍎' },
                { id: 'wheat', name: 'Trigo', icon: '🌾' },
                { id: 'diamond', name: 'Diamante', icon: '💎' },
                { id: 'emerald', name: 'Esmeralda', icon: '💚' },
                { id: 'gold_ingot', name: 'Ouro', icon: '🟡' },
                { id: 'iron_ingot', name: 'Ferro', icon: '⬜' },
                { id: 'coal', name: 'Carvão', icon: '⬛' },
                { id: 'stick', name: 'Graveto', icon: '🪵' },
                { id: 'book', name: 'Livro', icon: '📖' },
                { id: 'bone', name: 'Osso', icon: '🦴' },
                { id: 'string', name: 'Corda', icon: '📍' },
                { id: 'ender_pearl', name: 'Pérola do End', icon: '🔮' },
                { id: 'gunpowder', name: 'Pólvora', icon: '💥' },
                { id: 'leather', name: 'Couro', icon: '🧥' },
                { id: 'arrow', name: 'Flecha', icon: '🏹' },
                { id: 'clay_ball', name: 'Argila', icon: '⚪' },
                { id: 'feather', name: 'Pena', icon: '🪶' },
                { id: 'redstone', name: 'Redstone', icon: '🔴' },
                { id: 'glowstone', name: 'Pedra Brilhante', icon: '✨' },
                { id: 'obsidian', name: 'Obsidiana', icon: '🟣' }
            ],
            blocks: [
                { id: 'stone', name: 'Pedra', icon: '🪨' },
                { id: 'grass', name: 'Grama', icon: '🟢' },
                { id: 'dirt', name: 'Terra', icon: '🟫' },
                { id: 'sand', name: 'Areia', icon: '🟨' },
                { id: 'oak_wood', name: 'Madeira de Carvalho', icon: '🪚' },
                { id: 'oak_leaves', name: 'Folhas de Carvalho', icon: '🍃' },
                { id: 'cobblestone', name: 'Pedra Irregular', icon: '🏔️' },
                { id: 'bedrock', name: 'Rocha Matriz', icon: '🟫' },
                { id: 'lava', name: 'Lava', icon: '🌋' },
                { id: 'water', name: 'Água', icon: '💧' },
                { id: 'oak_planks', name: 'Tábuas de Carvalho', icon: '📦' },
                { id: 'chest', name: 'Baú', icon: '📦' },
                { id: 'furnace', name: 'Forno', icon: '🔥' },
                { id: 'crafting_table', name: 'Mesa de Trabalho', icon: '🛠️' },
                { id: 'iron_ore', name: 'Minério de Ferro', icon: '⬜' },
                { id: 'gold_ore', name: 'Minério de Ouro', icon: '🟡' },
                { id: 'diamond_ore', name: 'Minério de Diamante', icon: '💎' },
                { id: 'emerald_ore', name: 'Minério de Esmeralda', icon: '💚' },
                { id: 'glass', name: 'Vidro', icon: '🔲' },
                { id: 'bookshelf', name: 'Estante de Livros', icon: '📚' }
            ],
            mobs: [
                { id: 'creeper', name: 'Creeper', icon: '💚' },
                { id: 'skeleton', name: 'Esqueleto', icon: '💀' },
                { id: 'zombie', name: 'Zumbi', icon: '🧟' },
                { id: 'spider', name: 'Aranha', icon: '🕷️' },
                { id: 'enderman', name: 'Enderman', icon: '🟫' },
                { id: 'dragon', name: 'Dragão do End', icon: '🐉' },
                { id: 'wither', name: 'Wither', icon: '☠️' },
                { id: 'witch', name: 'Bruxa', icon: '🧙' },
                { id: 'ghast', name: 'Ghast', icon: '👻' },
                { id: 'blaze', name: 'Blaze', icon: '🔥' },
                { id: 'magma_cube', name: 'Cubo de Magma', icon: '🟠' },
                { id: 'pigman', name: 'Homem-Porco Zombie', icon: '🐷' },
                { id: 'guardian', name: 'Guardião', icon: '🐟' },
                { id: 'silverfish', name: 'Traça de Prata', icon: '🪳' },
                { id: 'cave_spider', name: 'Aranha de Caverna', icon: '🕷️' },
                { id: 'phantom', name: 'Phantom', icon: '👁️' },
                { id: 'pillager', name: 'Saqueador', icon: '👹' },
                { id: 'ravager', name: 'Devastador', icon: '🐄' },
                { id: 'hoglin', name: 'Hoglin', icon: '🐗' },
                { id: 'piglin', name: 'Piglin', icon: '👹' }
            ]
        };

        let currentCategory = 'items';
        let allItems = [...itemsData.items];
        let stats = {
            totalSpins: 0,
            uniqueItems: new Set(),
            itemCounts: {},
            history: []
        };
        let isSpinning = false;

        const carouselTrack = document.getElementById('carouselTrack');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const totalSpinsEl = document.getElementById('totalSpins');
        const uniqueItemsEl = document.getElementById('uniqueItems');
        const favoriteItemEl = document.getElementById('favoriteItem');
        const historyList = document.getElementById('historyList');
        const categoryBtns = document.querySelectorAll('.category-btn');

        // Change category
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const category = e.target.dataset.category;
                if (category === 'all') {
                    allItems = [
                        ...itemsData.items,
                        ...itemsData.blocks,
                        ...itemsData.mobs
                    ];
                } else {
                    allItems = [...itemsData[category]];
                }
                currentCategory = category;
                
                renderCarousel();
            });
        });

        function renderCarousel() {
            carouselTrack.innerHTML = '';
            
            // Triplicar items para criar efeito infinito
            const tripleItems = [...allItems, ...allItems, ...allItems];
            
            tripleItems.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'carousel-item' + (index === allItems.length + Math.floor(allItems.length / 2) ? ' center' : '');
                itemEl.innerHTML = `
                    <div class="item-icon">
                        <span style="font-size: 2em;">${item.icon}</span>
                    </div>
                    <div class="item-name">${item.name}</div>
                `;
                carouselTrack.appendChild(itemEl);
            });
            
            // Posicionar no centro
            const itemWidth = 150;
            const offset = -allItems.length * itemWidth;
            carouselTrack.style.transform = `translateX(${offset}px)`;
        }

        function spinRoulette() {
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;
            
            const spins = 15 + Math.floor(Math.random() * 10);
            const randomIndex = Math.floor(Math.random() * allItems.length);
            const itemWidth = 150;
            
            let currentSpin = 0;
            
            const spinInterval = setInterval(() => {
                currentSpin++;
                const offset = -allItems.length * itemWidth + (randomIndex * itemWidth) - (currentSpin * itemWidth);
                carouselTrack.style.transform = `translateX(${offset}px)`;
                
                if (currentSpin >= spins) {
                    clearInterval(spinInterval);
                    
                    const selectedItem = allItems[randomIndex];
                    recordSpin(selectedItem);
                    
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, 50);
        }

        function recordSpin(item) {
            stats.totalSpins++;
            stats.uniqueItems.add(item.id);
            stats.itemCounts[item.id] = (stats.itemCounts[item.id] || 0) + 1;
            stats.history.unshift(item.name);
            if (stats.history.length > 20) stats.history.pop();
            
            updateStats();
        }

        function updateStats() {
            totalSpinsEl.textContent = stats.totalSpins;
            uniqueItemsEl.textContent = stats.uniqueItems.size;
            
            // Favorite item
            if (Object.keys(stats.itemCounts).length > 0) {
                const favorite = Object.keys(stats.itemCounts).reduce((a, b) => 
                    stats.itemCounts[a] > stats.itemCounts[b] ? a : b
                );
                const favoriteData = allItems.find(item => item.id === favorite);
                favoriteItemEl.textContent = favoriteData ? favoriteData.name : '-';
            }
            
            // History
            historyList.innerHTML = stats.history.map(name => 
                `<div class="history-item">${name}</div>`
            ).join('');
        }

        function resetAll() {
            stats = {
                totalSpins: 0,
                uniqueItems: new Set(),
                itemCounts: {},
                history: []
            };
            updateStats();
        }

        spinBtn.addEventListener('click', spinRoulette);
        resetBtn.addEventListener('click', resetAll);

        // Initialize
        renderCarousel();
        updateStats();
    </script>
</body>
</html>
