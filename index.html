<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Minecraft Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 240px;
            background: #2a2a2a;
            border: 3px solid #22c55e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .carousel {
            display: flex;
            height: 100%;
            transform: translateX(0);
            will-change: transform;
            transition: none;
        }

        .carousel-item {
            min-width: 180px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-right: 1px solid #333;
        }

        .carousel-item img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .carousel-item.center {
            border: 4px solid #22c55e;
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.3);
        }

        .carousel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #22c55e;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 28px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-spin {
            background: #22c55e;
            color: #000;
            flex: 1;
            max-width: 300px;
        }

        .btn-spin:hover:not(:disabled) {
            background: #16a34a;
            transform: scale(1.05);
        }

        .btn-spin:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-reset {
            background: #f97316;
            color: #000;
            padding: 12px 20px;
        }

        .btn-reset:hover {
            background: #ea580c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #2a2a2a;
            border: 2px solid #22c55e;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #22c55e;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }

        .tab-btn {
            padding: 10px 16px;
            background: #2a2a2a;
            color: #aaa;
            border: none;
            cursor: pointer;
            font-size: 1em;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #22c55e;
            border-bottom-color: #22c55e;
        }

        .tab-btn:hover:not(.active) {
            color: #fff;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
        }

        .item-checkbox {
            position: relative;
            cursor: pointer;
        }

        .item-checkbox input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .item-checkbox label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px;
        }

        .item-checkbox input[type="checkbox"]:checked + label {
            border-color: #22c55e;
            background: #1a2a1a;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.2);
        }

        .item-checkbox img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin-bottom: 4px;
        }

        .item-checkbox span {
            font-size: 0.65em;
            text-align: center;
            color: #aaa;
            word-break: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 20px;
            line-height: 10px;
        }

        .select-all-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #22c55e;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .select-all-btn:hover {
            background: #16a34a;
        }

        .history {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 6px;
        }

        .history-item {
            text-align: center;
            padding: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .history-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            margin-bottom: 4px;
        }

        .history-item span {
            font-size: 0.7em;
            color: #aaa;
            display: block;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛏️ Minecraft Roulette</h1>

        <div class="carousel-container">
            <div class="carousel-pointer"></div>
            <div class="carousel" id="carousel"></div>
        </div>

        <div class="controls">
            <button class="btn-spin" id="spinBtn">GIRAR</button>
            <button class="btn-reset">RESETAR</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total de Giros</div>
                <div class="stat-value" id="totalSpins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Itens Únicos</div>
                <div class="stat-value" id="uniqueItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Favorito</div>
                <div class="stat-value" id="favorite">-</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="items">Items (831)</button>
            <button class="tab-btn" data-tab="blocks">Blocos (1228)</button>
            <button class="tab-btn" data-tab="mobs">Mobs (543)</button>
        </div>

        <div class="tab-content active" id="items-tab">
            <button class="select-all-btn" data-category="items">Selecionar Tudo</button>
            <div class="items-grid scrollbar-hide" id="items-grid"></div>
        </div>

        <div class="tab-content" id="blocks-tab">
            <button class="select-all-btn" data-category="blocks">Selecionar Tudo</button>
            <div class="items-grid scrollbar-hide" id="blocks-grid"></div>
        </div>

        <div class="tab-content" id="mobs-tab">
            <button class="select-all-btn" data-category="mobs">Selecionar Tudo</button>
            <div class="items-grid scrollbar-hide" id="mobs-grid"></div>
        </div>

        <h3 style="margin-top: 30px; margin-bottom: 15px;">Histórico (últimos 20)</h3>
        <div class="history" id="history"></div>
    </div>

    <script src="/minecraft-roulette/textures.js"></script>

    <script>
        const ITEM_WIDTH = 180;
        const SPIN_DURATION = 3000;

        let isSpinning = false;
        let selectedCategory = 'items';
        let currentItems = [];
        let spinHistory = [];
        let stats = {
            total: 0,
            unique: new Set(),
            counts: {}
        };

        function init() {
            renderAllItems();
            setupEventListeners();
            updateStats();
        }

        function renderAllItems() {
            renderGrid('items-grid', itemsData, 'items');
            renderGrid('blocks-grid', blocksData, 'blocks');
            renderGrid('mobs-grid', mobsData, 'mobs');
            updateCarousel();
        }

        function renderGrid(gridId, data, category) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            data.forEach(id => {
                const texture = textureMap[id];
                if (!texture) return;

                const checkbox = document.createElement('div');
                checkbox.className = 'item-checkbox';
                checkbox.innerHTML = `
                    <input type="checkbox" id="${category}-${id}" value="${id}" data-category="${category}" checked>
                    <label for="${category}-${id}">
                        <img src="${texture}" alt="${id}" onerror="this.style.display='none'">
                        <span>${id.replace(/_/g, ' ')}</span>
                    </label>
                `;
                grid.appendChild(checkbox);
            });
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    selectedCategory = btn.dataset.tab;
                    document.getElementById(`${selectedCategory}-tab`).classList.add('active');
                    updateCarousel();
                });
            });

            document.getElementById('spinBtn').addEventListener('click', spin);

            document.querySelector('.btn-reset').addEventListener('click', () => {
                spinHistory = [];
                stats = { total: 0, unique: new Set(), counts: {} };
                updateStats();
                document.getElementById('history').innerHTML = '';
            });

            document.querySelectorAll('.select-all-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    const checkboxes = document.querySelectorAll(`input[data-category="${category}"]`);
                    const allChecked = Array.from(checkboxes).every(c => c.checked);
                    checkboxes.forEach(c => c.checked = !allChecked);
                    updateCarousel();
                });
            });

            document.addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') {
                    updateCarousel();
                }
            });
        }

        function updateCarousel() {
            const category = selectedCategory;
            const checkboxes = document.querySelectorAll(`input[data-category="${category}"]:checked`);
            currentItems = Array.from(checkboxes).map(c => c.value);

            if (currentItems.length === 0) {
                currentItems = [category === 'items' ? itemsData[0] : category === 'blocks' ? blocksData[0] : mobsData[0]];
            }

            renderCarousel();
        }

        function renderCarousel() {
            const carousel = document.getElementById('carousel');
            carousel.style.transition = 'none';
            carousel.style.transform = 'translateX(0)';
            carousel.innerHTML = '';

            // 60 repetições garante conteúdo para qualquer spin
            for (let rep = 0; rep < 60; rep++) {
                currentItems.forEach(id => {
                    const texture = textureMap[id];
                    if (!texture) return;

                    const div = document.createElement('div');
                    div.className = 'carousel-item';
                    // Center item está na posição 29 (meio das 60 repetições)
                    if (rep === 29 && currentItems.indexOf(id) === 0) div.classList.add('center');
                    div.innerHTML = `<img src="${texture}" alt="${id}" onerror="this.style.display='none'">`;
                    carousel.appendChild(div);
                });
            }
        }

        function spin() {
            if (isSpinning || currentItems.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const itemCount = currentItems.length;
            const targetIndex = Math.floor(Math.random() * itemCount);
            const spinCount = 20 + Math.floor(Math.random() * 15);

            const totalDistance = (spinCount * itemCount + targetIndex) * ITEM_WIDTH;
            const carousel = document.getElementById('carousel');

            // Animar
            carousel.style.transition = `transform ${SPIN_DURATION}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
            carousel.style.transform = `translateX(-${totalDistance}px)`;

            // Esperar animação terminar
            setTimeout(() => {
                const winner = currentItems[targetIndex];
                addToHistory(winner);
                updateStats();

                // Reset: remover transition e voltar para posição inicial
                carousel.style.transition = 'none';
                carousel.style.transform = 'translateX(0)';

                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, SPIN_DURATION);
        }

        function addToHistory(itemId) {
            spinHistory.unshift(itemId);
            if (spinHistory.length > 20) spinHistory.pop();

            const history = document.getElementById('history');
            history.innerHTML = '';
            spinHistory.forEach((id, i) => {
                const texture = textureMap[id];
                if (!texture) return;

                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <img src="${texture}" alt="${id}" onerror="this.style.display='none'">
                    <span>${i + 1}</span>
                `;
                history.appendChild(div);
            });

            stats.total++;
            stats.unique.add(itemId);
            stats.counts[itemId] = (stats.counts[itemId] || 0) + 1;
        }

        function updateStats() {
            document.getElementById('totalSpins').textContent = stats.total;
            document.getElementById('uniqueItems').textContent = stats.unique.size;

            if (stats.total > 0) {
                const favorite = Object.keys(stats.counts).sort((a, b) => stats.counts[b] - stats.counts[a])[0];
                document.getElementById('favorite').textContent = favorite.replace(/_/g, ' ');
            }
        }

        init();
    </script>
</body>
</html>
