<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: #fff;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            color: #7ec850;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1em;
            color: #aaa;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        .roulette-container {
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 4px solid #7ec850;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .carousel-wrapper {
            position: relative;
            height: 150px;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.8) 100%);
            border: 2px solid #7ec850;
            margin-bottom: 30px;
        }

        .carousel {
            display: flex;
            height: 100%;
            transition: transform 0.1s linear;
            transform: translateX(0);
        }

        .carousel-item {
            min-width: 130px;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 500;
            text-align: center;
            word-wrap: break-word;
        }

        .carousel-item:hover {
            background: rgba(126, 200, 80, 0.1);
            border-color: #7ec850;
            transform: scale(1.05);
        }

        .carousel-item-icon {
            font-size: 2.5em;
            line-height: 1;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #7ec850;
            z-index: 10;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(126, 200, 80, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #7ec850;
        }

        .toggle-group label {
            color: #fff;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #7ec850;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .spin-btn {
            background: linear-gradient(135deg, #7ec850 0%, #5fa038 100%);
            color: #000;
            padding: 15px 50px;
            font-size: 1.2em;
            min-width: 200px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(126, 200, 80, 0.4);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .reset-btn {
            background: rgba(126, 200, 80, 0.2);
            color: #7ec850;
            border: 2px solid #7ec850;
        }

        .reset-btn:hover {
            background: rgba(126, 200, 80, 0.3);
            transform: translateY(-2px);
        }

        .result-container {
            background: linear-gradient(135deg, rgba(126, 200, 80, 0.1) 0%, rgba(126, 200, 80, 0.05) 100%);
            border: 2px solid #7ec850;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: #fff;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 30px;
        }

        .result-label {
            font-size: 0.95em;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .result-icon {
            font-size: 3em;
        }

        .result-text {
            font-size: 2em;
            font-weight: bold;
            color: #7ec850;
            text-shadow: 0 2px 10px rgba(126, 200, 80, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(126, 200, 80, 0.05);
            border: 1px solid #7ec850;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            color: #fff;
        }

        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #7ec850;
        }

        .history-container {
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 2px solid #7ec850;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .history-title {
            color: #7ec850;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(126, 200, 80, 0.1);
            border: 1px solid #7ec850;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.95em;
        }

        .history-icon {
            font-size: 1.3em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .carousel-item {
                min-width: 100px;
                height: 120px;
                gap: 6px;
            }

            .carousel-item-icon {
                font-size: 2em;
            }

            .carousel-wrapper {
                height: 130px;
            }

            .spin-btn {
                min-width: 150px;
                padding: 12px 25px;
                font-size: 1em;
            }

            .result-text {
                font-size: 1.5em;
            }

            .result-icon {
                font-size: 2em;
            }
        }

        .spinner-animation {
            animation: spin 0.4s ease-in-out;
        }

        @keyframes spin {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        ::-webkit-scrollbar {
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(126, 200, 80, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #7ec850;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5fa038;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛏️ MINECRAFT ROULETTE ⛏️</h1>
            <p>Gire a roleta e descubra qual item ou bloco você vai pegar!</p>
        </div>

        <div class="roulette-container">
            <div class="carousel-wrapper">
                <div class="pointer"></div>
                <div class="carousel" id="carousel"></div>
            </div>

            <div class="controls">
                <div class="toggle-group">
                    <label>
                        <input type="checkbox" id="itemsToggle" checked> Items
                    </label>
                    <label>
                        <input type="checkbox" id="blocksToggle" checked> Blocos
                    </label>
                    <label>
                        <input type="checkbox" id="mobsToggle" checked> Mobs
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button class="spin-btn" id="spinBtn">🎯 GIRAR!</button>
                <button class="reset-btn" id="resetBtn">↺ Reiniciar</button>
            </div>

            <div class="result-container">
                <div class="result-label">Resultado:</div>
                <div class="result-content">
                    <div class="result-icon" id="resultIcon">🎮</div>
                    <div class="result-text" id="resultText">Clique em GIRAR</div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total de Giros</div>
                    <div class="stat-value" id="totalSpins">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Itens Únicos</div>
                    <div class="stat-value" id="uniqueItems">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Item Favorito</div>
                    <div class="result-icon" id="favItem">-</div>
                </div>
            </div>

            <div class="history-container">
                <div class="history-title">📜 Histórico (últimas 20)</div>
                <div class="history-items" id="historyItems"></div>
            </div>
        </div>
    </div>

    <script>
        // Items do Minecraft
        const minecraftItems = {
            items: [
                { name: 'Maçã', icon: '🍎' },
                { name: 'Trigo', icon: '🌾' },
                { name: 'Ferro', icon: '⚙️' },
                { name: 'Ouro', icon: '✨' },
                { name: 'Diamante', icon: '💎' },
                { name: 'Esmeralda', icon: '🟢' },
                { name: 'Lapis Lazuli', icon: '🔵' },
                { name: 'Redstone', icon: '🔴' },
                { name: 'Carvão', icon: '⚫' },
                { name: 'Obsidiana', icon: '🖤' },
                { name: 'Netherrite', icon: '🟫' },
                { name: 'Ender Pérola', icon: '👁️' },
                { name: 'Kristal do End', icon: '⭐' },
                { name: 'Maçã Dourada', icon: '🏆' },
                { name: 'Pó de Blaze', icon: '🔥' },
                { name: 'Varinha Fermentada', icon: '🪄' },
                { name: 'Olho de Aranha', icon: '🕷️' },
                { name: 'Osso', icon: '🦴' },
                { name: 'String', icon: '🧵' },
                { name: 'Couro', icon: '🎀' }
            ],
            blocks: [
                { name: 'Pedra', icon: '🪨' },
                { name: 'Grama', icon: '🌿' },
                { name: 'Areia', icon: '🏜️' },
                { name: 'Madeira', icon: '🪵' },
                { name: 'Folhas', icon: '🍂' },
                { name: 'Vidro', icon: '🪟' },
                { name: 'Água', icon: '💧' },
                { name: 'Lava', icon: '🌋' },
                { name: 'Terra', icon: '🟫' },
                { name: 'Argila', icon: '⬜' },
                { name: 'Areia Vermelha', icon: '🟠' },
                { name: 'Pedra Nether', icon: '🟪' },
                { name: 'Bloco de Ouro', icon: '🟨' },
                { name: 'Bloco de Diamante', icon: '🟦' },
                { name: 'Anvil', icon: '🔨' },
                { name: 'Pista de Ativação', icon: '⚡' },
                { name: 'Escada', icon: '🪜' },
                { name: 'Porta', icon: '🚪' },
                { name: 'Cama', icon: '🛏️' },
                { name: 'Baú', icon: '📦' }
            ],
            mobs: [
                { name: 'Creeper', icon: '💚' },
                { name: 'Skeleton', icon: '💀' },
                { name: 'Zombie', icon: '🧟' },
                { name: 'Spider', icon: '🕷️' },
                { name: 'Enderman', icon: '👤' },
                { name: 'Wither', icon: '⚫' },
                { name: 'Dragon', icon: '🐉' },
                { name: 'Villager', icon: '👨' },
                { name: 'Cow', icon: '🐄' },
                { name: 'Pig', icon: '🐷' },
                { name: 'Sheep', icon: '🐑' },
                { name: 'Chicken', icon: '🐔' },
                { name: 'Horse', icon: '🐴' },
                { name: 'Wolf', icon: '🐺' },
                { name: 'Cat', icon: '🐱' },
                { name: 'Bee', icon: '🐝' },
                { name: 'Salmon', icon: '🐟' },
                { name: 'Axolotl', icon: '🦎' },
                { name: 'Frog', icon: '🐸' },
                { name: 'Panda', icon: '🐼' }
            ]
        };

        let allItems = [];
        let isSpinning = false;
        let history = [];
        let spinStats = {};
        let carouselOffset = 0;

        const carousel = document.getElementById('carousel');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultText = document.getElementById('resultText');
        const resultIcon = document.getElementById('resultIcon');
        const totalSpinsEl = document.getElementById('totalSpins');
        const uniqueItemsEl = document.getElementById('uniqueItems');
        const favItemEl = document.getElementById('favItem');
        const historyItemsEl = document.getElementById('historyItems');

        const itemsToggle = document.getElementById('itemsToggle');
        const blocksToggle = document.getElementById('blocksToggle');
        const mobsToggle = document.getElementById('mobsToggle');

        function updateItemsList() {
            allItems = [];
            if (itemsToggle.checked) allItems.push(...minecraftItems.items);
            if (blocksToggle.checked) allItems.push(...minecraftItems.blocks);
            if (mobsToggle.checked) allItems.push(...minecraftItems.mobs);

            if (allItems.length === 0) {
                itemsToggle.checked = true;
                allItems = [...minecraftItems.items];
            }

            renderCarousel();
        }

        function renderCarousel() {
            carousel.innerHTML = '';
            allItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'carousel-item';
                div.innerHTML = `<div class="carousel-item-icon">${item.icon}</div><div>${item.name}</div>`;
                carousel.appendChild(div);
            });
        }

        function spin() {
            if (isSpinning || allItems.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;

            const spins = 30 + Math.floor(Math.random() * 20);
            const selectedIndex = Math.floor(Math.random() * allItems.length);
            const itemWidth = 130;
            const finalOffset = selectedIndex * itemWidth;

            let currentSpin = 0;

            const spinInterval = setInterval(() => {
                if (currentSpin < spins) {
                    carouselOffset = (carouselOffset + itemWidth) % (allItems.length * itemWidth);
                    carousel.style.transform = `translateX(-${carouselOffset}px)`;
                    currentSpin++;
                } else {
                    carousel.style.transform = `translateX(-${finalOffset}px)`;
                    clearInterval(spinInterval);
                    
                    const selected = allItems[selectedIndex];
                    showResult(selected);
                    recordSpin(selected);
                    
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            }, 30);
        }

        function showResult(item) {
            resultIcon.textContent = item.icon;
            resultText.textContent = item.name;
            resultIcon.classList.add('spinner-animation');
            setTimeout(() => resultIcon.classList.remove('spinner-animation'), 400);
        }

        function recordSpin(item) {
            history.unshift(item);
            if (history.length > 20) history.pop();

            spinStats[item.name] = (spinStats[item.name] || 0) + 1;
            
            updateStats();
            updateHistory();
        }

        function updateStats() {
            totalSpinsEl.textContent = Object.values(spinStats).reduce((a, b) => a + b, 0);
            uniqueItemsEl.textContent = Object.keys(spinStats).length;

            let favItem = Object.keys(spinStats).reduce((a, b) => 
                spinStats[a] > spinStats[b] ? a : b, Object.keys(spinStats)[0]
            );

            if (favItem) {
                const item = allItems.find(i => i.name === favItem);
                favItemEl.textContent = item ? item.icon : '-';
            }
        }

        function updateHistory() {
            historyItemsEl.innerHTML = '';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div class="history-icon">${item.icon}</div><div>${item.name}</div>`;
                historyItemsEl.appendChild(div);
            });
        }

        function reset() {
            history = [];
            spinStats = {};
            carouselOffset = 0;
            carousel.style.transform = 'translateX(0)';
            resultIcon.textContent = '🎮';
            resultText.textContent = 'Clique em GIRAR';
            updateStats();
            updateHistory();
        }

        spinBtn.addEventListener('click', spin);
        resetBtn.addEventListener('click', reset);
        itemsToggle.addEventListener('change', updateItemsList);
        blocksToggle.addEventListener('change', updateItemsList);
        mobsToggle.addEventListener('change', updateItemsList);

        // Inicializar
        updateItemsList();
    </script>
</body>
</html>
