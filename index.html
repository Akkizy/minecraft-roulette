<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            font-family: 'Minecraft', 'Arial', sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #7ec850, #5aad2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 0.95em;
        }

        /* Roleta */
        .carousel-container {
            position: relative;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #7ec850;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(126, 200, 80, 0.3);
            margin-bottom: 20px;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #7ec850;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .carousel-wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.05s linear;
        }

        .carousel-item {
            flex: 0 0 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            opacity: 0.5;
            transition: all 0.1s;
        }

        .carousel-item.active {
            opacity: 1;
            transform: scale(1.15);
        }

        .item-icon {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .carousel-item.active .item-icon {
            background: rgba(126, 200, 80, 0.3);
            border: 4px solid #7ec850;
            box-shadow: 
                0 0 25px rgba(126, 200, 80, 0.9),
                0 0 50px rgba(126, 200, 80, 0.5),
                inset 0 0 20px rgba(126, 200, 80, 0.4);
            animation: glow 1.5s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { 
                box-shadow: 0 0 25px rgba(126, 200, 80, 0.9), 0 0 50px rgba(126, 200, 80, 0.5), inset 0 0 20px rgba(126, 200, 80, 0.4);
            }
            50% { 
                box-shadow: 0 0 35px rgba(126, 200, 80, 1), 0 0 70px rgba(126, 200, 80, 0.7), inset 0 0 25px rgba(126, 200, 80, 0.6);
            }
        }

        .item-icon span {
            font-size: 4em;
        }

        .item-name {
            font-size: 0.9em;
            text-align: center;
            color: #b0b0b0;
            max-width: 160px;
            font-weight: 500;
        }

        .carousel-item.active .item-name {
            color: #7ec850;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(126, 200, 80, 0.5);
        }

        /* Controles */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-spin {
            background: linear-gradient(135deg, #7ec850, #5aad2a);
            color: white;
            min-width: 150px;
            box-shadow: 0 5px 20px rgba(126, 200, 80, 0.3);
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(126, 200, 80, 0.5);
        }

        .btn-spin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(126, 200, 80, 0.15);
            color: #7ec850;
            border: 2px solid #7ec850;
        }

        .btn-secondary:hover {
            background: rgba(126, 200, 80, 0.25);
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #7ec850;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(126, 200, 80, 0.2);
        }

        .stat-value {
            font-size: 2em;
            color: #7ec850;
            font-weight: bold;
            margin: 5px 0;
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 0.8em;
            text-transform: uppercase;
        }

        /* Seleção */
        .selection-section {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #7ec850;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1em;
            color: #7ec850;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 8px 15px;
            background: rgba(126, 200, 80, 0.15);
            border: 2px solid #7ec850;
            color: #7ec850;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .tab-btn:hover {
            background: rgba(126, 200, 80, 0.25);
        }

        .tab-btn.active {
            background: #7ec850;
            color: #0a0e27;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px 5px;
        }

        .item-checkbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(126, 200, 80, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .item-checkbox:hover {
            background: rgba(126, 200, 80, 0.2);
            border-color: rgba(126, 200, 80, 0.6);
        }

        .item-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #7ec850;
        }

        .item-checkbox label {
            font-size: 0.85em;
            cursor: pointer;
            flex: 1;
        }

        .item-icon-small {
            font-size: 2em;
        }

        .select-all-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: rgba(126, 200, 80, 0.2);
            border: 1px solid #7ec850;
            color: #7ec850;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .select-all-btn:hover {
            background: rgba(126, 200, 80, 0.3);
        }

        /* History */
        .history-section {
            margin-top: 10px;
        }

        .history-title {
            font-size: 1.1em;
            color: #7ec850;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .history-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(126, 200, 80, 0.15);
            border: 1px solid rgba(126, 200, 80, 0.4);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(126, 200, 80, 0.25);
            border-color: #7ec850;
            color: #7ec850;
        }

        .empty-message {
            text-align: center;
            color: #a0a0a0;
            padding: 15px;
            font-size: 0.9em;
        }

        /* Scrollbar */
        .items-grid::-webkit-scrollbar,
        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .items-grid::-webkit-scrollbar-track,
        .history-list::-webkit-scrollbar-track {
            background: rgba(126, 200, 80, 0.1);
            border-radius: 10px;
        }

        .items-grid::-webkit-scrollbar-thumb,
        .history-list::-webkit-scrollbar-thumb {
            background: #7ec850;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .carousel-item {
                flex: 0 0 150px;
            }

            .item-icon {
                width: 90px;
                height: 90px;
            }

            .item-icon span {
                font-size: 3em;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>⛏️ Minecraft Roulette</h1>
            <p class="subtitle">Selecione os itens e gire!</p>
        </header>

        <!-- Roleta -->
        <div class="carousel-container">
            <div class="pointer"></div>
            <div class="carousel-wrapper">
                <div class="carousel-track" id="carouselTrack"></div>
            </div>
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="btn btn-spin" id="spinBtn">🎲 GIRAR</button>
            <button class="btn btn-secondary" id="resetBtn">↻ RESETAR</button>
        </div>

        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Giros</div>
                <div class="stat-value" id="totalSpins">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Únicos</div>
                <div class="stat-value" id="uniqueItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Favorito</div>
                <div class="stat-value" id="favoriteItem">-</div>
            </div>
        </div>

        <!-- Seleção de Itens -->
        <div class="selection-section">
            <div class="section-title">🎯 Selecionar Itens</div>
            
            <div class="category-tabs">
                <button class="tab-btn active" data-tab="items">Items</button>
                <button class="tab-btn" data-tab="blocks">Blocos</button>
                <button class="tab-btn" data-tab="mobs">Mobs</button>
            </div>

            <div class="items-grid" id="itemsGrid"></div>
            
            <button class="select-all-btn" id="selectAllBtn">✓ Selecionar Tudo</button>
        </div>

        <!-- Histórico -->
        <div class="history-section">
            <div class="history-title">📜 Histórico (Últimos 20)</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const itemsData = {
            items: [
                { id: 'apple', name: 'Maçã', icon: '🍎' },
                { id: 'wheat', name: 'Trigo', icon: '🌾' },
                { id: 'diamond', name: 'Diamante', icon: '💎' },
                { id: 'emerald', name: 'Esmeralda', icon: '💚' },
                { id: 'gold_ingot', name: 'Ouro', icon: '🟡' },
                { id: 'iron_ingot', name: 'Ferro', icon: '⬜' },
                { id: 'coal', name: 'Carvão', icon: '⬛' },
                { id: 'stick', name: 'Graveto', icon: '🪵' },
                { id: 'book', name: 'Livro', icon: '📖' },
                { id: 'bone', name: 'Osso', icon: '🦴' },
                { id: 'string', name: 'Corda', icon: '📍' },
                { id: 'ender_pearl', name: 'Pérola do End', icon: '🔮' },
                { id: 'gunpowder', name: 'Pólvora', icon: '💥' },
                { id: 'leather', name: 'Couro', icon: '🧥' },
                { id: 'arrow', name: 'Flecha', icon: '🏹' },
                { id: 'clay_ball', name: 'Argila', icon: '⚪' },
                { id: 'feather', name: 'Pena', icon: '🪶' },
                { id: 'redstone', name: 'Redstone', icon: '🔴' },
                { id: 'glowstone', name: 'Pedra Brilhante', icon: '✨' },
                { id: 'obsidian', name: 'Obsidiana', icon: '🟣' }
            ],
            blocks: [
                { id: 'stone', name: 'Pedra', icon: '🪨' },
                { id: 'grass', name: 'Grama', icon: '🟢' },
                { id: 'dirt', name: 'Terra', icon: '🟫' },
                { id: 'sand', name: 'Areia', icon: '🟨' },
                { id: 'oak_wood', name: 'Madeira', icon: '🪚' },
                { id: 'oak_leaves', name: 'Folhas', icon: '🍃' },
                { id: 'cobblestone', name: 'Pedra Irregular', icon: '🏔️' },
                { id: 'bedrock', name: 'Rocha Matriz', icon: '⬛' },
                { id: 'lava', name: 'Lava', icon: '🌋' },
                { id: 'water', name: 'Água', icon: '💧' },
                { id: 'oak_planks', name: 'Tábuas', icon: '📦' },
                { id: 'chest', name: 'Baú', icon: '🎁' },
                { id: 'furnace', name: 'Forno', icon: '🔥' },
                { id: 'crafting_table', name: 'Mesa', icon: '🛠️' },
                { id: 'iron_ore', name: 'Minério Ferro', icon: '⬜' },
                { id: 'gold_ore', name: 'Minério Ouro', icon: '🟡' },
                { id: 'diamond_ore', name: 'Minério Diamante', icon: '💎' },
                { id: 'emerald_ore', name: 'Minério Esmeralda', icon: '💚' },
                { id: 'glass', name: 'Vidro', icon: '🔲' },
                { id: 'bookshelf', name: 'Estante', icon: '📚' }
            ],
            mobs: [
                { id: 'creeper', name: 'Creeper', icon: '💚' },
                { id: 'skeleton', name: 'Esqueleto', icon: '💀' },
                { id: 'zombie', name: 'Zumbi', icon: '🧟' },
                { id: 'spider', name: 'Aranha', icon: '🕷️' },
                { id: 'enderman', name: 'Enderman', icon: '🟫' },
                { id: 'dragon', name: 'Dragão', icon: '🐉' },
                { id: 'wither', name: 'Wither', icon: '☠️' },
                { id: 'witch', name: 'Bruxa', icon: '🧙' },
                { id: 'ghast', name: 'Ghast', icon: '👻' },
                { id: 'blaze', name: 'Blaze', icon: '🔥' },
                { id: 'magma_cube', name: 'Magma Cube', icon: '🟠' },
                { id: 'pigman', name: 'Porco Zombie', icon: '🐷' },
                { id: 'guardian', name: 'Guardião', icon: '🐟' },
                { id: 'silverfish', name: 'Traça', icon: '🪳' },
                { id: 'cave_spider', name: 'Aranha Caverna', icon: '🕷️' },
                { id: 'phantom', name: 'Phantom', icon: '👁️' },
                { id: 'pillager', name: 'Saqueador', icon: '👹' },
                { id: 'ravager', name: 'Devastador', icon: '🐄' },
                { id: 'hoglin', name: 'Hoglin', icon: '🐗' },
                { id: 'piglin', name: 'Piglin', icon: '👹' }
            ]
        };

        let currentTab = 'items';
        let selectedItems = new Set();
        let allItems = [...itemsData.items];
        let stats = { totalSpins: 0, uniqueItems: new Set(), itemCounts: {}, history: [] };
        let isSpinning = false;

        const ITEM_WIDTH = 180;

        // Elements
        const itemsGrid = document.getElementById('itemsGrid');
        const carouselTrack = document.getElementById('carouselTrack');
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const tabBtns = document.querySelectorAll('.tab-btn');

        // Initialize
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                renderItems();
            });
        });

        selectAllBtn.addEventListener('click', toggleSelectAll);
        spinBtn.addEventListener('click', spinRoulette);
        resetBtn.addEventListener('click', resetStats);

        function renderItems() {
            const items = itemsData[currentTab];
            itemsGrid.innerHTML = '';

            items.forEach(item => {
                const isSelected = selectedItems.has(item.id);
                const div = document.createElement('div');
                div.className = 'item-checkbox';
                div.innerHTML = `
                    <input type="checkbox" id="${item.id}" ${isSelected ? 'checked' : ''}>
                    <span class="item-icon-small">${item.icon}</span>
                    <label for="${item.id}">${item.name}</label>
                `;
                
                const checkbox = div.querySelector('input');
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        selectedItems.add(item.id);
                    } else {
                        selectedItems.delete(item.id);
                    }
                    renderCarousel();
                });

                itemsGrid.appendChild(div);
            });
        }

        function toggleSelectAll() {
            const items = itemsData[currentTab];
            const allChecked = items.every(item => selectedItems.has(item.id));

            if (allChecked) {
                items.forEach(item => selectedItems.delete(item.id));
            } else {
                items.forEach(item => selectedItems.add(item.id));
            }

            renderItems();
            renderCarousel();
        }

        function renderCarousel() {
            carouselTrack.innerHTML = '';
            const itemsToUse = selectedItems.size > 0 
                ? itemsData[currentTab].filter(item => selectedItems.has(item.id))
                : itemsData[currentTab];

            if (itemsToUse.length === 0) {
                carouselTrack.innerHTML = '<div class="empty-message">Selecione itens para girar</div>';
                spinBtn.disabled = true;
                return;
            }

            spinBtn.disabled = false;
            allItems = itemsToUse;

            itemsToUse.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'carousel-item' + (index === 0 ? ' active' : '');
                itemEl.innerHTML = `
                    <div class="item-icon"><span>${item.icon}</span></div>
                    <div class="item-name">${item.name}</div>
                `;
                carouselTrack.appendChild(itemEl);
            });
        }

        function spinRoulette() {
            if (isSpinning || allItems.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;

            const targetIndex = Math.floor(Math.random() * allItems.length);
            const spinCount = 20 + Math.floor(Math.random() * 15);
            const totalDistance = spinCount * allItems.length * ITEM_WIDTH + targetIndex * ITEM_WIDTH;

            const startTime = Date.now();
            const duration = 3000;

            const animate = () => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                carouselTrack.style.transform = `translateX(-${totalDistance * easeProgress}px)`;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    carouselTrack.style.transform = `translateX(-${totalDistance}px)`;
                    const selectedItem = allItems[targetIndex];
                    recordSpin(selectedItem);
                    updateActiveItem(targetIndex);
                    isSpinning = false;
                    spinBtn.disabled = false;
                }
            };

            requestAnimationFrame(animate);
        }

        function updateActiveItem(index) {
            document.querySelectorAll('.carousel-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function recordSpin(item) {
            stats.totalSpins++;
            stats.uniqueItems.add(item.id);
            stats.itemCounts[item.id] = (stats.itemCounts[item.id] || 0) + 1;
            stats.history.unshift(item.name);
            if (stats.history.length > 20) stats.history.pop();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalSpins').textContent = stats.totalSpins;
            document.getElementById('uniqueItems').textContent = stats.uniqueItems.size;

            if (Object.keys(stats.itemCounts).length > 0) {
                const favorite = Object.keys(stats.itemCounts).reduce((a, b) =>
                    stats.itemCounts[a] > stats.itemCounts[b] ? a : b
                );
                const allData = [...itemsData.items, ...itemsData.blocks, ...itemsData.mobs];
                const favoriteData = allData.find(item => item.id === favorite);
                document.getElementById('favoriteItem').textContent = favoriteData ? favoriteData.icon : '-';
            }

            const historyList = document.getElementById('historyList');
            historyList.innerHTML = stats.history.length > 0
                ? stats.history.map(name => `<div class="history-item">${name}</div>`).join('')
                : '<div class="empty-message">Nenhum giro ainda</div>';
        }

        function resetStats() {
            stats = { totalSpins: 0, uniqueItems: new Set(), itemCounts: {}, history: [] };
            updateStats();
        }

        // Initialize
        renderItems();
        renderCarousel();
    </script>
</body>
</html>
